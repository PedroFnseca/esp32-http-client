site_name: ESP32-HTTP-Client
site_url: https://esp32httpclient.com/
site_description: ESP32 HTTP client library designed for embedded applications, featuring a fluent API, efficient memory usage, and direct JSON handling.
site_author: Pedro Fonseca
repo_name: PedroFnseca/esp32-http-client
repo_url: https://github.com/PedroFnseca/esp32-http-client
edit_uri: edit/main/docs/

extra:
  alternate:
    - name: 🇺🇸 English
      link: /
      lang: en
    - name: 🇧🇷 Português
      link: /pt/
      lang: pt-BR
  analytics:
    provider: google
    property: G-TFXJLYGKZM
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PedroFnseca/esp32-http-client/
      name: GitHub Repository

theme:
  favicon: assets/favicon.ico
  custom_dir: overrides
  icon:
    logo: material/memory
    alternate: material/translate
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    - scheme: default
      primary: teal
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: Cascadia Code
  features:
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - i18n:
      reconfigure_search: true
      languages:
        - locale: en
          name: 🇺🇸 English
          default: true
        - locale: pt
          name: 🇧🇷 Português
          build: true
          nav_translations:
            Home: Início
            Getting Started: Primeiros Passos
            Installation: Instalação
            Quick Start: Início Rápido
            Guide: Guia
            Initialization: Inicialização
            Making Requests: Fazendo Requisições
            Reading Responses: Lendo Respostas
            Advanced Usage: Uso Avançado
            Examples: Exemplos
            CRUD Operations: Operações CRUD
            Struct <-> JSON: Mapeamento Struct/JSON
            URL Parameters: Parâmetros de URL
            Authentication: Autenticação
            Callbacks & Errors: Callbacks e Erros
            Nested JSON: JSON Aninhado
            Array JSON: JSON Array
            Raw JSON: JSON Bruto
            Unix Timestamp: Timestamp Unix
            Custom Port: Porta Personalizada
            API Reference: Referência da API
            ESP32HTTPClient: ESP32HTTPClient
            RestRequest: RestRequest
            FAQ: Perguntas Frequentes
            Performance: Desempenho
            Repository: Repositório
            Releases: Lançamentos
  - search:
      lang:
        - en
        - pt
  - tags
  - git-revision-date-localized
  - social:
      cards_layout_options:
        background_color: "#00897B"
        background_image: docs/assets/preview.png
        description: ESP32 HTTP client library designed for embedded applications, featuring a fluent API, efficient memory usage, and direct JSON handling.

extra_javascript:
  - javascripts/extra.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - Guide:
    - guide/index.md
    - Initialization: guide/initialization.md
    - Making Requests: guide/requests.md
    - Reading Responses: guide/responses.md
    - Advanced Usage: guide/advanced.md
  - Examples:
    - examples/index.md
    - CRUD Operations: examples/crud-operations.md
    - Struct <-> JSON: examples/struct-json.md
    - URL Parameters: examples/url-parameters.md
    - Authentication: examples/auth-helpers.md
    - Callbacks & Errors: examples/callbacks-and-errors.md
    - Nested JSON: examples/nested-json.md
    - Array JSON: examples/array-json.md
    - Raw JSON: examples/raw-json.md
    - Unix Timestamp: examples/unix-timestamp.md
    - Custom Port: examples/port-selection.md
  - API Reference:
    - api/index.md
    - ESP32HTTPClient: api/esp32httpclient.md
    - RestRequest: api/restrequest.md
  - FAQ: faq.md
  - Performance: performance.md
  - Repository: https://github.com/PedroFnseca/esp32-http-client/
  - Releases: https://github.com/PedroFnseca/esp32-http-client/releases

