name: Release

on:
  push:
    branches:
      - main

env:
  GIT_BOT_NAME: "github-actions[bot]"
  GIT_BOT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
  GIT_BOT_AUTHOR: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from library.properties
        id: version
        run: |
          VERSION=$(grep '^version=' library.properties | cut -d'=' -f2 | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update Version in Documentation
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=${{ steps.version.outputs.version }}

          sed -i "s|PedroFnseca/ESP32-HTTP-Client@\^[0-9.]*|PedroFnseca/ESP32-HTTP-Client@^${VERSION}|g" README.md
          sed -i "s|PedroFnseca/ESP32-HTTP-Client@\^[0-9.]*|PedroFnseca/ESP32-HTTP-Client@^${VERSION}|g" docs/index.md
          sed -i "s|PedroFnseca/ESP32-HTTP-Client@\^[0-9.]*|PedroFnseca/ESP32-HTTP-Client@^${VERSION}|g" docs/index.pt.md
          sed -i "s|PedroFnseca/ESP32-HTTP-Client@\^[0-9.]*|PedroFnseca/ESP32-HTTP-Client@^${VERSION}|g" docs/getting-started/installation.md
          sed -i "s|PedroFnseca/ESP32-HTTP-Client@\^[0-9.]*|PedroFnseca/ESP32-HTTP-Client@^${VERSION}|g" docs/getting-started/installation.pt.md
          sed -i "s|PedroFnseca/ESP32-HTTP-Client@\^[0-9.]*|PedroFnseca/ESP32-HTTP-Client@^${VERSION}|g" docs/llms-full.txt
          sed -i "/id: library-version/,/validations:/ s|e.g., [0-9.]* or main branch|e.g., ${VERSION} or main branch|" .github/ISSUE_TEMPLATE/bug_report.yml
          sed -i "/id: library-version/,/validations:/ s|placeholder: [0-9.]*|placeholder: ${VERSION}|" .github/ISSUE_TEMPLATE/bug_report.yml
          sed -i "/id: library-version/,/validations:/ s|placeholder: [0-9.]*|placeholder: ${VERSION}|" .github/ISSUE_TEMPLATE/question.yml

      - name: Commit and Push Version Update
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update version tag"
          file_pattern: README.md docs/index.md docs/index.pt.md docs/getting-started/installation.md docs/getting-started/installation.pt.md docs/llms-full.txt .github/ISSUE_TEMPLATE/bug_report.yml .github/ISSUE_TEMPLATE/question.yml
          commit_user_name: ${{ env.GIT_BOT_NAME }}
          commit_user_email: ${{ env.GIT_BOT_EMAIL }}
          commit_author: ${{ env.GIT_BOT_AUTHOR }}

      - name: Check if tag exists
        id: tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          git config user.name "${{ env.GIT_BOT_NAME }}"
          git config user.email "${{ env.GIT_BOT_EMAIL }}"

          git tag "$TAG"
          git push origin "$TAG"

      - name: Generate Release Notes
        if: steps.tag.outputs.exists == 'false'
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREVIOUS_TAG..HEAD"
          fi

          echo "# What's Changed" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          create_section() {
            TITLE="$1"
            PREFIX="$2"

            COMMITS=$(git log $RANGE --pretty=format:"%s (%h)" \
              | grep "^$PREFIX:" \
              | sed "s/^$PREFIX: /- /")

            if [ -n "$COMMITS" ]; then
              echo "## $TITLE" >> RELEASE_NOTES.md
              echo "" >> RELEASE_NOTES.md
              echo "$COMMITS" >> RELEASE_NOTES.md
              echo "" >> RELEASE_NOTES.md
            fi
          }

          create_section "Features" "feat"
          create_section "Bug Fixes" "fix"
          create_section "Performance Improvements" "perf"
          create_section "Documentation" "docs"
          create_section "Code Refactoring" "refactor"
          create_section "Tests" "test"
          create_section "Styles" "style"

          CHORES=$(git log $RANGE --pretty=format:"%s (%h)" \
            | grep "^chore:" \
            | grep -v "bump version" \
            | sed 's/^chore: /- /')

          if [ -n "$CHORES" ]; then
            echo "## Miscellaneous Chores" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "$CHORES" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
          fi

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "---" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...v${{ steps.version.outputs.version }}" >> RELEASE_NOTES.md
          fi

      - name: Package Release ZIP
        if: steps.tag.outputs.exists == 'false'
        run: |
          ZIP_NAME="ESP32-HTTP-Client-v${{ steps.version.outputs.version }}.zip"
          zip -r "$ZIP_NAME" src examples library.properties library.json README.md LICENSE SECURITY.md CONTRIBUTING.md

      - name: Create GitHub Release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            ESP32-HTTP-Client-v${{ steps.version.outputs.version }}.zip

      - name: Publish to PlatformIO Registry
        if: steps.tag.outputs.exists == 'false'
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        run: |
          python -m pip install --upgrade platformio
          pio pkg publish --no-interactive
